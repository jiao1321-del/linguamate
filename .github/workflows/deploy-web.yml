name: Build and Deploy LinguaMate Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web
        run: flutter build web --release --base-href "/linguamate/" --pwa-strategy=none

      - name: Version web assets
        run: |
          sed -i "s|src=\"flutter_bootstrap.js\"|src=\"flutter_bootstrap.js?v=${GITHUB_SHA}\"|" build/web/index.html
          sed -i "s|\"mainJsPath\":\"main.dart.js\"|\"mainJsPath\":\"main.dart.js?v=${GITHUB_SHA}\"|" build/web/flutter_bootstrap.js

      - name: Finalize Pages files
        run: |
          cat > build/web/flutter_service_worker.js <<'EOF'
          self.addEventListener('install', () => {
            self.skipWaiting();
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(
                keys
                  .filter((key) =>
                    key === 'flutter-app-cache' ||
                    key === 'flutter-temp-cache' ||
                    key.startsWith('linguamate-')
                  )
                  .map((key) => caches.delete(key))
              );

              await self.registration.unregister();

              const clients = await self.clients.matchAll({
                type: 'window',
                includeUncontrolled: true,
              });

              for (const client of clients) {
                client.navigate(client.url);
              }
            })());
          });
          EOF

          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
