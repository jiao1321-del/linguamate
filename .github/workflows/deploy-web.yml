name: Build and Deploy LinguaMate Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Smoke test AI chat endpoint
        if: github.event_name == 'pull_request' && github.head_ref == 'v1.3-ai-chat-coach'
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            'https://svzsynadhzvflauxppwn.supabase.co/functions/v1/chat-language' \
            --header 'Content-Type: application/json' \
            --header 'apikey: sb_publishable_UoxuXbXG8Qvy0Snte4jmPQ_IIPI-IzR' \
            --header 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2enN5bmFkaHp2ZmxhdXhwcHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NDIxNjIsImV4cCI6MjEwNjAxODE2Mn0.zhl-nd806Gs_VGmNg70UEKEWwck-Iielnb6JCD8sRjI' \
            --data '{"message":"Today I go gym after work.","targetLanguage":"English","history":[]}' \
            --output /tmp/linguamate-chat-smoke.json

          python3 - <<'PY'
          import json

          with open('/tmp/linguamate-chat-smoke.json', encoding='utf-8') as f:
              payload = json.load(f)

          reply = payload.get('reply')
          assert isinstance(reply, dict), payload

          for field in ('reply', 'correction', 'explanation', 'translation'):
              value = reply.get(field)
              assert isinstance(value, str), (field, payload)

          assert reply['reply'].strip(), payload
          assert reply['translation'].strip(), payload
          print('LinguaMate AI chat smoke test passed')
          print('Reply:', reply['reply'])
          PY

      - name: Build Web
        run: flutter build web --release --base-href "/linguamate/" --pwa-strategy=none

      - name: Generate PWA icon sizes
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image

          source = "build/web/icons/Shili-192-v052.png"
          image = Image.open(source).convert("RGB")
          image.resize((512, 512), Image.Resampling.LANCZOS).save(
              "build/web/icons/Shili-512-v052.png",
              optimize=True,
          )
          PY

      - name: Version web assets
        run: |
          sed -i "s|\"mainJsPath\":\"main.dart.js\"|\"mainJsPath\":\"main.dart.js?v=${GITHUB_SHA}\"|" build/web/flutter_bootstrap.js
          grep -q "main.dart.js?v=${GITHUB_SHA}" build/web/flutter_bootstrap.js
          grep -q "flutter_bootstrap.js?fresh=" build/web/index.html

      - name: Finalize Pages files
        run: |
          cat > build/web/flutter_service_worker.js <<'EOF'
          self.addEventListener('install', () => {
            self.skipWaiting();
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(
                keys
                  .filter((key) =>
                    key === 'flutter-app-cache' ||
                    key === 'flutter-temp-cache' ||
                    key.startsWith('linguamate-')
                  )
                  .map((key) => caches.delete(key))
              );

              await self.registration.unregister();

              const clients = await self.clients.matchAll({
                type: 'window',
                includeUncontrolled: true,
              });

              for (const client of clients) {
                client.navigate(client.url);
              }
            })());
          });
          EOF

          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
