<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="LinguaMate — 個人化中文、English、Tagalog / Taglish 語言學習助手。">
  <meta name="theme-color" content="#6750A4">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LinguaMate">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Shili-192-v052.png">

  <link rel="icon" type="image/png" href="icons/Shili-192-v052.png">
  <link rel="manifest" href="manifest.json?v=052">

  <title>LinguaMate</title>
</head>
<body>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(
            registrations.map((registration) => registration.unregister()),
          );
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(
            keys
              .filter(
                (key) =>
                  key === 'flutter-app-cache' ||
                  key === 'flutter-temp-cache' ||
                  key.startsWith('linguamate-'),
              )
              .map((key) => caches.delete(key)),
          );
        }
      } catch (error) {
        console.warn('LinguaMate cache cleanup failed:', error);
      }

      const bootstrapScript = document.createElement('script');
      bootstrapScript.src =
        'flutter_bootstrap.js?fresh=' + Date.now().toString();
      bootstrapScript.async = true;
      document.body.appendChild(bootstrapScript);
    })();
  </script>
</body>
</html>
